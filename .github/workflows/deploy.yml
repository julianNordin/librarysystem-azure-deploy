name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is what lets the job request an OIDC token from GitHub. Without it,
# azure/login fails with a message about being unable to acquire a token, which reads like a
# problem with the federated credential rather than a missing permission on the job.
permissions:
  id-token: write
  contents: read

# One deployment at a time. Two overlapping runs would race on the same resource group, and the
# second would deploy an older artefact over a newer one if it happened to finish last.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-librarysystem-dev
  AZURE_LOCATION: swedencentral

jobs:
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    outputs:
      apiAppName: ${{ steps.outputs.outputs.apiAppName }}
      apiHostName: ${{ steps.outputs.outputs.apiHostName }}
      webAppName: ${{ steps.outputs.outputs.webAppName }}
      webHostName: ${{ steps.outputs.outputs.webHostName }}
      sqlServerName: ${{ steps.outputs.outputs.sqlServerName }}
      sqlServerFqdn: ${{ steps.outputs.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.outputs.outputs.sqlDatabaseName }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          # Identifiers, not credentials. They say which identity to attempt to become; the
          # token GitHub mints for this specific repository and branch is what actually
          # authenticates. None of the three is secret, so all three are variables.
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure the resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Deploy Bicep
        env:
          # main.bicepparam reads this with readEnvironmentVariable, so the password reaches the
          # template through the environment rather than as a command line argument that would
          # appear in the process list and in the run log's command echo.
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name librarysystem-infra \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --output none

      - name: Read deployment outputs
        id: outputs
        run: |
          # Read hostnames from the deployment rather than building them. Default hostnames are
          # normally predictable, but the unique-default-hostname feature can append a suffix,
          # and a hand-built string breaks silently when it does.
          outputs=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name librarysystem-infra \
            --query properties.outputs \
            --output json)

          {
            echo "apiAppName=$(echo "$outputs" | jq -r '.apiAppName.value')"
            echo "apiHostName=$(echo "$outputs" | jq -r '.apiHostName.value')"
            echo "webAppName=$(echo "$outputs" | jq -r '.webAppName.value')"
            echo "webHostName=$(echo "$outputs" | jq -r '.webHostName.value')"
            echo "sqlServerName=$(echo "$outputs" | jq -r '.sqlServerName.value')"
            echo "sqlServerFqdn=$(echo "$outputs" | jq -r '.sqlServerFullyQualifiedDomainName.value')"
            echo "sqlDatabaseName=$(echo "$outputs" | jq -r '.sqlDatabaseName.value')"
          } >> "$GITHUB_OUTPUT"

  migrate:
    name: Database migrations
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the migrations bundle
        # `migrations bundle`, never `migrations add`. Bundle packages the migrations that
        # already exist into a self-contained executable; add would generate a new one and stamp
        # today's date into both its filename and its [Migration] attribute.
        run: |
          dotnet tool install --global dotnet-ef --version 9.*
          dotnet ef migrations bundle \
            --project src/LibrarySystem.Api \
            --startup-project src/LibrarySystem.Api \
            --self-contained -r linux-x64 \
            --configuration Release \
            --output efbundle \
            --force

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the SQL firewall for this runner
        id: firewall
        run: |
          # The runner's address is not in the firewall: the hardening pass narrowed it to the
          # API app's outbound addresses. Open a hole for exactly this address, and nothing more.
          runner_ip=$(curl -s --max-time 30 https://api.ipify.org)
          echo "runner ip: $runner_ip"
          {
            echo "rule=migrate-${{ github.run_id }}"
            echo "ip=$runner_ip"
          } >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "${{ needs.infrastructure.outputs.sqlServerName }}" \
            --name "migrate-${{ github.run_id }}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      - name: Apply migrations
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_SERVER_NAME: ${{ needs.infrastructure.outputs.sqlServerName }}
          SQL_SERVER_FQDN: ${{ needs.infrastructure.outputs.sqlServerFqdn }}
          SQL_DATABASE_NAME: ${{ needs.infrastructure.outputs.sqlDatabaseName }}
          FIREWALL_RULE: ${{ steps.firewall.outputs.rule }}
          OPENED_FOR_IP: ${{ steps.firewall.outputs.ip }}
        run: |
          chmod +x ./efbundle
          connection="Server=tcp:${SQL_SERVER_FQDN},1433;Initial Catalog=${SQL_DATABASE_NAME};User ID=libsysadmin;Password=${SQL_ADMIN_PASSWORD};Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"

          if ./efbundle --connection "$connection" 2>migrate-err.txt; then
            echo "migrations applied"
            exit 0
          fi

          # A public echo service reports the address used to reach *it*, over HTTPS. Behind a
          # NAT pool the SQL connection can leave from a different address, leaving the rule
          # correct for the wrong one. The server's error names the address it actually saw,
          # which is authoritative - take it and try once more.
          cat migrate-err.txt
          reported=$(grep -oE "Client with IP address '[0-9.]+'" migrate-err.txt \
            | grep -oE '[0-9]{1,3}(\.[0-9]{1,3}){3}' | head -1)

          if [ -z "$reported" ] || [ "$reported" = "$OPENED_FOR_IP" ]; then
            echo "migration failed for a reason other than the firewall address"
            exit 1
          fi

          echo "the server saw $reported instead; reopening for that address"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$SQL_SERVER_NAME" \
            --name "$FIREWALL_RULE" \
            --start-ip-address "$reported" \
            --end-ip-address "$reported" \
            --output none
          sleep 10
          ./efbundle --connection "$connection"

      - name: Close the SQL firewall
        # always(): a failed migration must never be the reason the database is left reachable
        # from a GitHub runner. This is the whole point of splitting the rule into its own step.
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "${{ needs.infrastructure.outputs.sqlServerName }}" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --output none

  api:
    name: API
    runs-on: ubuntu-latest
    needs: [infrastructure, migrate]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish src/LibrarySystem.Api --configuration Release --output publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.infrastructure.outputs.apiAppName }}
          package: publish

  web:
    name: SPA
    runs-on: ubuntu-latest
    needs: [infrastructure, api]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        working-directory: src/web
        run: npm ci

      - name: Build
        working-directory: src/web
        env:
          # Vite bakes this into the bundle at build time, which is why the front end cannot be
          # built until the API's hostname is known. No trailing slash: apiClient concatenates
          # '/api/books' onto it directly.
          VITE_API_BASE_URL: https://${{ needs.infrastructure.outputs.apiHostName }}
        run: npm run build

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.infrastructure.outputs.webAppName }}
          package: src/web/dist

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [infrastructure, api, web]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the deployed environment
        shell: pwsh
        # The same script scripts/deploy.ps1 runs locally, so the check proven on a workstation
        # is byte-for-byte the check that runs here. A deploy that reports success without
        # checking anything is a deploy nobody should trust.
        run: |
          ./scripts/smoke.ps1 `
            -ApiHostName '${{ needs.infrastructure.outputs.apiHostName }}' `
            -WebHostName '${{ needs.infrastructure.outputs.webHostName }}'
